<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: gray;
        }

        .wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            gap: 10px;
        }

        header {
            background-color: #00c3e3;
            height: 100px;
            display: flex;
            align-items: center;
            gap: 15px;
            font-weight: 20px;
            border: 1px solid;
        }

        nav {
            background-color:rgb(94, 255, 0);
            padding: 15px;
            text-align: left;
            font-weight: bold;
            border: 1px solid;
        }

        .main-content {
            display: flex;
            gap: 10px;
            flex: 1;
        }

        article {
            flex: 3;
            background-color:hotpink;
            padding: 15px;
            border: 1px solid hotpink;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        section {
            background-color:darkslategrey;
            padding: 15px;
            border: 1px solid #000220;
            flex: 1;
            display: flex;
            align-items: center;
        }

        aside {
            flex:1 ;
            background-color: #00bcd4;
            padding: 15px;
            border: 1px solid #00acc1;
        }

        footer {
            background-color: #DEB887;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            border: 1px solid;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <header>
            <img src="img/logo.png" alt="ini gambar" width="150px">
            <p>ini website ku</p>
        </header>

        <nav>
            nav
        </nav>

        <div class="main-content">
            <article>
                article
                <section>sec</section>
                <section>sec</section>
                <section>sec</section>
            </article>

            <aside>
                nig
            </aside>
        </div>

        <footer>

        </footer>
    </div>
</body>
</html>
